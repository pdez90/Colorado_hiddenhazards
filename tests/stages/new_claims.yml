- id: h_readme_mortality_bg_prose_ratios
  file: README.md
  text: "(natural causes 1.035 per SD, 95% CI 1.000–1.071, p = 0.047; all causes 1.034, 1.001–1.069, p = 0.044), the\nhigh-confidence subset carries none (1.012, 0.978–1.046), and known historical sites none (1.006). The non-hazardous-manufacturer\nplacebo is larger and clearly significant (1.055, 1.014–1.099), and with it in the model the hidden-site ratio is no longer\ndistinguishable from 1 (1.025, 0.988–1.064)"
  check: >-
    (lambda m: (lambda g: [g('deaths_nat', 'M4 +hidden').z_hidden_rr, g('deaths_nat', 'M4 +hidden').z_hidden_lo, g('deaths_nat', 'M4 +hidden').z_hidden_hi,
    g('deaths_all', 'M4 +hidden').z_hidden_rr, g('deaths_all', 'M4 +hidden').z_hidden_lo, g('deaths_all', 'M4 +hidden').z_hidden_hi,
    g('deaths_nat', 'M4 hidden high-confidence only').z_hidden_hiconf_rr, g('deaths_nat', 'M4 hidden high-confidence only').z_hidden_hiconf_lo, g('deaths_nat', 'M4 hidden high-confidence only').z_hidden_hiconf_hi,
    g('deaths_nat', 'M4 +hidden').z_known_hist_rr,
    g('deaths_nat', 'Placebo: M2 +non-hazardous mfrs').z_placebo_rr, g('deaths_nat', 'Placebo: M2 +non-hazardous mfrs').z_placebo_lo, g('deaths_nat', 'Placebo: M2 +non-hazardous mfrs').z_placebo_hi,
    g('deaths_nat', 'M4 +placebo').z_hidden_rr, g('deaths_nat', 'M4 +placebo').z_hidden_lo, g('deaths_nat', 'M4 +placebo').z_hidden_hi])(
    lambda o, k: m[(m.outcome == o) & (m.model == k)].iloc[0]))(load('data/results/mortality_bg_models.csv'))
  expect: [1.035, 1.000, 1.071, 1.034, 1.001, 1.069, 1.012, 0.978, 1.046, 1.006, 1.055, 1.014, 1.099, 1.025, 0.988, 1.064]
