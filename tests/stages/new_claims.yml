- id: h_paper_ed_race_gradients
  file: paper/Before_and_After_the_Map_manuscript.md
  text: "(−0.50 pooled, +0.02 controlled). Black Denverites were a small population, about 2.4–2.8% of the city in every census, so the gradient rests on few districts and the with/without comparison flips with them (Black shares were lower in firm districts in 1920, 1930 and 1940). The Hispanic gradient is small before 1920 and steepens to −3.44 in 1940, and it is not only a downtown gradient: with distance to downtown controlled it is −0.43 in 1920 and −2.25 in 1940 (both p < 0.05), −1.19 in 1930 (p = 0.11) and −1.07 pooled (p < 0.001)."
  check: "(lambda d: (lambda r: [r(0, 'pct_black').b_per_log_m, r(0, 'pct_black').b_cbd_ctrl, r(1940, 'pct_hisp').b_per_log_m, r(1920, 'pct_hisp').b_cbd_ctrl, r(1940, 'pct_hisp').b_cbd_ctrl, (lambda q: 0.05 if q < 0.05 else q)(max(r(1920, 'pct_hisp').p_cbd_ctrl, r(1940, 'pct_hisp').p_cbd_ctrl)), r(1930, 'pct_hisp').b_cbd_ctrl, r(1930, 'pct_hisp').p_cbd_ctrl, r(0, 'pct_hisp').b_cbd_ctrl, (lambda q: 0.001 if q < 0.001 else q)(r(0, 'pct_hisp').p_cbd_ctrl)])(lambda c, o: d[(d.census == c) & (d.outcome == o)].iloc[0]))(load('app/data/ed_distance_models.csv'))"
  expect: [-0.50, 0.02, -3.44, -0.43, -2.25, 0.05, -1.19, 0.11, -1.07, 0.001]
