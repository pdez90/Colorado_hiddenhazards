# Stage manifest (proposal, review 4): every committed file under `roots` is the declared output of exactly one stage,
# a declared byte-identical copy of one (`copies`, app/data only), or listed under `unscripted` with the reason.
# tests/stages/test_stage_H_publication.py::test_every_committed_file_is_declared_once enforces it.
# Pattern syntax: fnmatch globs; "glob!excl" removes basenames matching `excl` from the glob.
# run_by: run_all.sh | rerun_results.sh | none (a script no orchestrator runs).
roots:
- data/results
- data/historical
- data/by_year
- app/data
orchestrators:
  run_all.sh: inventory + pre-1960 chains (Python)
  rerun_results.sh: result scripts (R) + health tables + paper tables + SI + manifest
  none: run by hand; no orchestrator calls it
stages:
- id: export
  script: pipeline/export.py
  run_by: run_all.sh
  inputs:
  - work/inv/records_final.pkl
  - work/inv/sites_final.pkl
  outputs:
  - data/results/CO_directory_listings_1961-2002.csv
  - data/results/CO_hazardous_listings_not_street_located.csv
  - data/results/CO_hazardous_sites_1961-2002.xlsx
  - data/results/CO_historical_industrial_sites.geojson
  note: 'R/fix_direction_geocodes.R (run_all.sh) later rewrites the listings and sites in place: a second writer of the same files'
- id: export_by_year
  script: pipeline/export_by_year.py
  run_by: run_all.sh
  inputs:
  - work/inv/records_final.pkl
  outputs:
  - data/by_year/CO_DCM_*_geocoded.csv
  copies:
  - app/data/by_year/CO_DCM_*_geocoded.csv
  note: app/data/by_year is copied by a cp line in run_all.sh; R/fix_direction_geocodes.R rewrites data/by_year in place before the copy
- id: validate_geocoding
  script: pipeline/validate_geocoding.py
