# Claims registry: numbers quoted in README.md, app/app.R and the data/results/*/summary.md
# write-ups, each with the exact text that must be present and a check that recomputes the
# number from the committed data files. See tests/outputs/test_claims.py for the format.
#
# Tolerance: by default half a unit of the last decimal as written in `expect`
# (3169 -> 0.5, 37.9 -> 0.05); `tol` overrides it (a number or a list, one per expected value).
# `stale: reason` marks a claim whose text is known to be out of date (strict xfail: remove the
# key once the text has been corrected).

# ------------------------------------------------------------------ README: key results
- id: readme_listings_complete_editions
  file: README.md
  text: "44,808 listings in the 13 complete editions (1965–1992)"
  check: "[len(listings()), listings().year.nunique()]"
  expect: [44808, 13]

- id: readme_establishments
  file: README.md
  text: "→ 24,079 establishments"
  check: "listings().estab_id.nunique()"
  expect: 24079

- id: readme_sites_total
  file: README.md
  text: "**3,482 hazardous-sector sites** located at street level"
  check: "len(fe_sites())"
  expect: 3482

- id: readme_hidden_sites
  file: README.md
