    m[(m.outcome == 'p_pov') & (m.period == '1980-2010') & (m.grade == 'D')].p_conley2km.iloc[0], m[(m.outcome == 'lmval') & (m.period == '1940-1980') & (m.grade == 'D')].p_conley2km.iloc[0]])(load('data/results/holc/holc_tract_models.csv'))
