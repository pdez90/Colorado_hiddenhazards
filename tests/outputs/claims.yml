- id: readme_health_mental_health_row
  file: README.md
  text: "| Poor mental health (%) | -0.187 (0.081)* | 0.171 (0.103) | -0.043 (0.090) | -3.4 | 0.0202 |"
  check: >-
    (lambda h, o: (lambda m4, pl, m3, lr: [m4.z_hidden_b, m4.z_hidden_se, m4.z_known_hist_b, m4.z_known_hist_se,
    pl.z_placebo_b, pl.z_placebo_se, m4.aic_sem - m3.aic_sem, lr.lr_p])(
    h[(h.outcome == o) & (h.model == 'M4 +hidden')].iloc[0], h[(h.outcome == o) & (h.model == 'M4 +placebo')].iloc[0],
    h[(h.outcome == o) & (h.model == 'M3 +known historical')].iloc[0],
    h[(h.outcome == o) & (h.model == 'LR M4 +hidden vs M3 +known historical')].iloc[0]))(load('data/results/health_models.csv'), 'Poor mental health (%)')
  expect: [-0.187, 0.081, 0.171, 0.103, -0.043, 0.090, -3.4, 0.0202]
  tol: [0.0005, 0.0005, 0.0005, 0.0005, 0.0005, 0.0005, 0.06, 0.00005]

