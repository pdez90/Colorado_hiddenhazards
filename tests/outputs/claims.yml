# ------------------------------------------------------------------ README: Denver 1880-1940 city series and 1880 buildings
- id: readme_black_dissimilarity_1880_1940
  file: README.md
  text: "rose from 0.41 (1880) to 0.51 (1900), 0.65 (1920) and 0.82 (1940)"
  check: "(lambda d: [d[d.census == y].dissim_black.iloc[0] for y in (1880, 1900, 1920, 1940)])(load('app/data/denver_city_1880_1940.csv'))"
  expect: [0.41, 0.51, 0.65, 0.82]

- id: readme_foreign_born_share_fell
  file: README.md
  text: "from 24% to 8% while its dissimilarity stayed at 0.13–0.26"
  check: "(lambda d: [d[d.census == 1880].pct_fb.iloc[0], d[d.census == 1940].pct_fb.iloc[0], d.dissim_fb.min(), d.dissim_fb.max()])(load('app/data/denver_city_1880_1940.csv'))"
  expect: [24, 8, 0.13, 0.26]

