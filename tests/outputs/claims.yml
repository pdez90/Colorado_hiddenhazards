  expect: [0.41, 0.51, 0.65, 0.82]

- id: readme_foreign_born_share_fell
  file: README.md
  text: "from 24% to 8% while its dissimilarity stayed at 0.13–0.26"
  check: "(lambda d: [d[d.census == 1880].pct_fb.iloc[0], d[d.census == 1940].pct_fb.iloc[0], d.dissim_fb.min(), d.dissim_fb.max()])(load('app/data/denver_city_1880_1940.csv'))"
