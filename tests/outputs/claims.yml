    (lambda r: mh_conditional_or([(int(k[(r.period == p) & (r.holc == 'D')].sum()), int((~k[(r.period == p) & (r.holc == 'D')]).sum()),
    int(k[(r.period == p) & r.holc.isin(['A', 'B'])].sum()), int((~k[(r.period == p) & r.holc.isin(['A', 'B'])]).sum()))
    for k in [r.direction.isin(['Residential to business', 'Residential to industrial'])] for p in ('a', 'b', 'c')]))(
    (lambda c: c.assign(period=c.year.map(lambda y: 'a' if y <= 1945 else ('b' if y <= 1954 else 'c'))))((lambda c: c[(~c.annexation.astype(bool)) & c.holc.notna()])(load('data/results/rezoning/changes.csv'))))
