    m[(m.grade == 'D') & (((m.outcome == 'p_pov') & m.period.isin(['1980-2010', '1970-2010'])) | ((m.outcome == 'lmval') & m.period.isin(['1940-1980', '1940-2010'])))]))(load('data/results/holc/holc_tract_models.csv'))
